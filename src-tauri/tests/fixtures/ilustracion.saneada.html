
<html>
<head><title>El ciclo del agua</title></head>
<body>
<h1>El ciclo del agua</h1>
<p>El agua se evapora, se condensa en nubes y vuelve a caer.</p>
<figure>
<svg viewbox="0 0 400 200" width="400" height="200" role="img" aria-label="Esquema del ciclo del agua">
  <title>Esquema del ciclo del agua</title>
  <defs>
    <lineargradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ecbf0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </lineargradient>
    <marker id="punta" markerwidth="8" markerheight="8" refx="4" refy="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f5f8b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="400" height="200" fill="url(#cielo)"/>
  <ellipse cx="300" cy="50" rx="60" ry="25" fill="#dddddd" stroke="#888888" stroke-width="2"/>
  <path d="M60,170 C60,90 240,40 290,70" fill="none" stroke="#1f5f8b" stroke-width="3" marker-end="url(#punta)"/>
  <g transform="translate(20,180)">
    <polygon points="0,0 360,0 360,20 0,20" fill="#2d6a4f"/>
    <text x="180" y="14" font-size="12" text-anchor="middle" fill="#ffffff">Mar</text>
  </g>
</svg>
<figcaption>El recorrido del agua entre el mar y las nubes.</figcaption>
</figure>
<p>La portada de muchos libros se compone igual, con la imagen dentro del dibujo:</p>
<svg version="1.1" width="100%" height="100%" viewbox="0 0 600 800" preserveaspectratio="xMidYMid meet">
  <image width="600" height="800" href="imagenes/portada.jpg"/>
</svg>
</body>
</html>
