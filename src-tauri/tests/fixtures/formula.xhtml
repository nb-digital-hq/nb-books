<h1>Ecuaciones de segundo grado</h1>
<p>Toda ecuación de la forma
<math xmlns="http://www.w3.org/1998/Math/MathML"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></math>
tiene por soluciones las que da la fórmula general:</p>
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block" alttext="x = (-b ± √(b² - 4ac)) / 2a">
  <semantics>
    <mrow>
      <mi>x</mi>
      <mo>=</mo>
      <mfrac>
        <mrow><mo>−</mo><mi>b</mi><mo>±</mo><msqrt><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>a</mi><mi>c</mi></msqrt></mrow>
        <mrow><mn>2</mn><mi>a</mi></mrow>
      </mfrac>
    </mrow>
    <annotation encoding="application/x-tex">x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}</annotation>
  </semantics>
</math>
<p>Y el discriminante, ordenado en una tabla:</p>
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
  <mtable columnalign="left">
    <mtr><mtd><mi>Δ</mi><mo>&gt;</mo><mn>0</mn></mtd><mtd><mtext>dos raíces reales</mtext></mtd></mtr>
    <mtr><mtd><mi>Δ</mi><mo>=</mo><mn>0</mn></mtd><mtd><mtext>una raíz doble</mtext></mtd></mtr>
    <mtr><mtd><mi>Δ</mi><mo>&lt;</mo><mn>0</mn></mtd><mtd><mtext>dos raíces complejas</mtext></mtd></mtr>
  </mtable>
</math>
</body>
</html>
