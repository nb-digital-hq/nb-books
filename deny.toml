# Política de licencias y seguridad de las dependencias de Rust.
# Es la forma ejecutable de docs/architecture/dependency-policy.md
# NB Books se publica bajo Apache-2.0 (ADR-003), lo que determina qué puede
# incorporar: en particular, GPLv2 es incompatible y queda prohibida.

[advisories]
version = 2
yanked = "deny"

# Lo que se acepta a sabiendas, con fecha y motivo.
#
# Una lista de excepciones sin motivo escrito es una forma de apagar la
# comprobación; con motivo y fecha es una decisión que se puede revisar. Todas
# las de abajo son del árbol de Tauri: no son dependencias nuestras y no hay
# versión a la que saltar sin que Tauri lo haga primero.
#
# Se revisan en cada actualización de Tauri. El detalle y la evidencia están en
# docs/audit/supply-chain.md, sección 3.1.
ignore = [
  # Sin mantenimiento, vía el árbol de Tauri. Revisado el 2026-09-08.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "Python-2.0",
  "0BSD",
  # Licencia de datos, no de código: la trae el catálogo de raíces de confianza
  # de Mozilla, que usa cualquier cliente TLS del ecosistema. Permisiva y sin
  # reciprocidad. Revisión registrada en
  # docs/architecture/dependency-policy.md, sección 4.1.
  "CDLA-Permissive-2.0",
  # Licencia de tipografías, no de código. La traen IBM Plex Sans y Literata,
  # que **viajan dentro de la aplicación** porque sin ellas la interfaz se ve
  # con una fuente distinta en cada sistema operativo. Permisiva, sin
  # reciprocidad sobre el software que las usa; su única obligación es
  # distribuir el texto de la licencia, y está en static/fuentes/LICENCIAS.md.
  # Revisión registrada en
  # docs/architecture/dependency-policy.md, sección 4.1.
  "OFL-1.1",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
